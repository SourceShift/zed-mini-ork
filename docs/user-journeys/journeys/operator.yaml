  - id: operator/step-a-run-by-hand
    persona: operator
    value: "A single node is executed in isolation to test a change cheaply"
    impact: "Fixing a node stops requiring a full run"
    preconditions:
      - "The recipe's workflow exists"
    steps:
      - cap: cli:execute
